<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check Result Section-Wise</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 500px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        #resultDisplay { margin-top: 20px; background: #f9f9f9; padding: 15px; border-left: 4px solid #007BFF; }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Result Portal</h2>
    <label for="sectionSelect">Select Section:</label>
    <select id="sectionSelect">
        <option value="A">Section A</option>
        <option value="B">Section B</option>
        <option value="C">Section C</option>
    </select>

    <label for="rollInput">Enter Roll Number:</label>
    <input type="number" id="rollInput" placeholder="e.g. 101">

    <button onclick="checkResult()">Check Result</button>

    <div id="resultDisplay" style="display: none;"></div>
</div>

<script src="script.js"></script>
</body>
</html>
